# Alembic migration configuration
# NOTE: this file is read by configparser with the platform locale encoding,
# so keep it ASCII-only (Chinese comments would break on Windows/GBK).

[alembic]
# directory holding the migration scripts
script_location = alembic

# add the current working directory to sys.path so `app` is importable
prepend_sys_path = .

# The database URL is NOT hardcoded here: alembic/env.py reads it from
# app.config settings (single source of truth, overridable via DATABASE_URL env).
sqlalchemy.url =

# No [loggers]/[handlers]/[formatters] sections on purpose, so Alembic does not
# call fileConfig() and clobber the application's loguru logging.
